name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q
      # Săpt. 10: adaugă un service MySQL/Postgres, încarcă schema, rulează generatorul
      # și testele de invarianți, apoi `dbt build`.
