services:
  mysql:
    image: mysql:8.0
    container_name: cod-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      # 3307 pe host, ca să nu se bată cu MySQL80 instalat local (3306)
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # fișierele .sql de aici rulează automat, în ordine alfabetică,
      # doar la prima pornire cu volum gol
      - ./sql/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16
    container_name: cod-postgres
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE:-cod_warehouse}
    ports:
      # 5433 pe host, ca să nu se bată cu un PostgreSQL instalat local (5432)
      - "${PG_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${PG_DATABASE:-cod_warehouse}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
  pg_data:
